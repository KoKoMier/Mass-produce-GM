[platformio]
default_envs = application

[env:application]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
board_build.ldscript = ldscripts/application.ld

upload_protocol = custom
upload_command = "$PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd.exe" -s "$PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/stm32f1x.cfg -c "program {$SOURCE} 0x08004000 verify reset; shutdown"
